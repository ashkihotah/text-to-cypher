[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text2cypher"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Nicolò Resta", email = "n.resta6@studenti.uniba.it" }
]
dependencies = [
    "accelerate>=1.12.0",
    "datasets>=4.4.1",
    "huggingface-hub[hf-xet]>=0.36.0",
    "pandas>=2.3.3",
    "torch>=2.9.1",
    "transformers>=4.57.3",
    "tree-sitter>=0.25.2",
    "tree-sitter-cypher",
    "zss>=1.2.0",
]

[dependency-groups]
dev = [
    "dvc>=3.64.2",
    "ipykernel>=7.1.0",
    "kaggle>=1.8.2",
    "mlflow>=3.7.0",
    "pytest>=9.0.2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]
it-core-news-sm = [
    { url = "https://github.com/explosion/spacy-models/releases/download/it_core_news_sm-3.8.0/it_core_news_sm-3.8.0-py3-none-any.whl" },
]
tree-sitter-cypher = { workspace = true }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.workspace]
members = [
    "tree-sitter-cypher",
]

